<!DOCTYPE html>
<html>
<head>
    <title>Limpiar Caché - PWA Clase C</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .info { background: #f3f4f6; padding: 15px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧹 Limpiar Caché y Datos</h1>
    
    <div class="info">
        <h3>Estado Actual:</h3>
        <p id="current-status">Verificando...</p>
    </div>
    
    <button onclick="clearLocalStorage()">Limpiar LocalStorage</button>
    <button onclick="clearServiceWorker()">Limpiar Service Worker</button>
    <button onclick="clearAll()">Limpiar Todo</button>
    <button onclick="checkStatus()">Verificar Estado</button>
    
    <div id="results"></div>

    <script>
        function checkStatus() {
            const results = document.getElementById('results');
            let status = '<h3>Estado del Sistema:</h3>';
            
            // Verificar localStorage
            try {
                const progress = localStorage.getItem('clase-c-progress');
                if (progress) {
                    const data = JSON.parse(progress);
                    status += `<p>✅ LocalStorage: ${data.completedSessions?.length || 0} sesiones guardadas</p>`;
                } else {
                    status += `<p>❌ LocalStorage: Vacío</p>`;
                }
            } catch (e) {
                status += `<p>❌ LocalStorage: Error - ${e.message}</p>`;
            }
            
            // Verificar Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    status += `<p>✅ Service Worker: ${registrations.length} registrado(s)</p>`;
                    results.innerHTML = status;
                });
            } else {
                status += `<p>❌ Service Worker: No soportado</p>`;
                results.innerHTML = status;
            }
        }
        
        function clearLocalStorage() {
            try {
                localStorage.removeItem('clase-c-progress');
                document.getElementById('results').innerHTML = '<p>✅ LocalStorage limpiado</p>';
            } catch (e) {
                document.getElementById('results').innerHTML = `<p>❌ Error: ${e.message}</p>`;
            }
        }
        
        function clearServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.unregister();
                    });
                    document.getElementById('results').innerHTML = '<p>✅ Service Worker limpiado</p>';
                });
            } else {
                document.getElementById('results').innerHTML = '<p>❌ Service Worker no soportado</p>';
            }
        }
        
        function clearAll() {
            clearLocalStorage();
            clearServiceWorker();
            document.getElementById('results').innerHTML = '<p>✅ Todo limpiado. Recarga la página.</p>';
        }
        
        // Verificar estado al cargar
        window.onload = checkStatus;
    </script>
</body>
</html>
