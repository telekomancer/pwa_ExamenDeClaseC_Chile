    <rect x="40" y="40" width="80" height="40" rx="8" fill="#e5e7eb"/>
    <rect x="192" y="40" width="80" height="40" rx="8" fill="#e5e7eb"/>
    <!-- Ruedas -->
    <circle cx="80" cy="160" r="30" fill="#374151"/>
